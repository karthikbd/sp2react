version: 2
build:
  os: ubuntu-24.04
  tools: { python: "3.12" }
python:
  install:
    # Same hash-locked tooling as the CI docs job; the package itself has no dependencies.
    - requirements: ci/requirements-docs.txt
    - method: pip
      path: .
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
