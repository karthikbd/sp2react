[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp2react"
version = "0.1.1"
authors = [{name = "Karthikeyan Balasundaram"}]
description = "AI-agent pipeline that converts classic SharePoint ASPX/jQuery list forms and pages into a React + FastAPI app on your existing database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "sharepoint", "sharepoint migration", "react", "fastapi", "jquery", "spservices",
    "aspx", "list forms", "migration", "code conversion", "ai agents", "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ntlm = ["requests-ntlm>=1.2"]
db = ["sqlalchemy>=2.0"]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.1"]
mssql = ["sqlalchemy>=2.0", "pyodbc>=5.0"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27", "sqlalchemy>=2.0"]

[project.scripts]
sp2react = "sp2react.cli:main"

[project.urls]
Homepage = "https://github.com/karthikbd/sp2react"
"Source Code" = "https://github.com/karthikbd/sp2react"
Repository = "https://github.com/karthikbd/sp2react"
"Bug Tracker" = "https://github.com/karthikbd/sp2react/issues"
Changelog = "https://github.com/karthikbd/sp2react/blob/main/CHANGELOG.md"
Documentation = "https://github.com/karthikbd/sp2react#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sp2react*"]

[tool.setuptools.package-data]
sp2react = ["agents/prompts/*.md", "scaffold/*.json", "scaffold/templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
