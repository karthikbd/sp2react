[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sp2react"
version = "0.1.5"
authors = [{name = "Karthikeyan Balasundaram"}]
description = "AI-agent pipeline that converts classic SharePoint ASPX/jQuery list forms and pages into a React + FastAPI app on your existing database. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "sharepoint", "sharepoint migration", "react", "fastapi", "jquery", "spservices",
    "aspx", "list forms", "migration", "code conversion", "ai agents", "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = []          # standard library only: HTTP + NTLM, YAML and validation are part of the package

[project.optional-dependencies]
ntlm = []                  # kept so `pip install sp2react[ntlm]` still works; NTLM is built in
db = ["sqlalchemy>=2.0"]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.1.1"]
mssql = ["sqlalchemy>=2.0", "pyodbc>=5.0"]
dev = ["pytest>=9.0.3", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27", "sqlalchemy>=2.0", "requests>=2.33.0"]   # sp2react itself needs none; these run the generated app in tests

[project.scripts]
sp2react = "sp2react.cli:main"

[project.urls]
Homepage = "https://github.com/karthikbd/sp2react"
"Source Code" = "https://github.com/karthikbd/sp2react"
Repository = "https://github.com/karthikbd/sp2react"
"Bug Tracker" = "https://github.com/karthikbd/sp2react/issues"
Changelog = "https://github.com/karthikbd/sp2react/blob/main/CHANGELOG.md"
Documentation = "https://sp2react.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sp2react*"]

[tool.setuptools.package-data]
sp2react = ["py.typed", "agents/prompts/*.md", "scaffold/*.json", "scaffold/templates/**/*", "container/Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "S", "C4", "PIE", "RUF"]
ignore = ["B008", "B023", "B027", "B905", "E501", "E731", "E741", "SIM105", "SIM115", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# the generated app's tests and the package's tests: asserts, fixed test secrets, temp paths, subprocesses
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S310", "S311", "S603", "S607", "S608", "RUF012", "RUF015", "RUF059"]
"src/sp2react/scaffold/templates/backend/tests/**" = ["S101", "S105", "S106"]
# "@me" / "@today" are rule tokens, not passwords
"src/sp2react/scaffold/templates/backend/app/rules.py" = ["S105"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["src/sp2react/scaffold/templates/"]     # the generated app's source, type-checked when the app is built

[tool.coverage.run]
source = ["sp2react"]
omit = ["*/scaffold/templates/*"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = true
