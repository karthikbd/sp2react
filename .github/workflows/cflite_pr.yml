name: ClusterFuzzLite PR fuzzing

# Fuzzes the code a pull request changes (tests/fuzz: config YAML, spec validation, ASPX/JavaScript analysis,
# CAML and OData filters, NTLM challenge parsing).
on:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  pr:
    runs-on: ubuntu-latest
    concurrency:
      group: cflite-pr-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          report-timeouts: true
          sanitizer: address
          output-sarif: true
