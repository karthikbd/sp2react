name: DCO

# Every commit in a pull request must carry a Signed-off-by line (Developer Certificate of Origin,
# see CONTRIBUTING.md). Pure shell over git: no third-party action, no secrets.
on:
  pull_request:

permissions: read-all

jobs:
  dco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "ok   $c $author"
            else
              echo "::error::commit $c by $author has no Signed-off-by line (git commit -s; see CONTRIBUTING.md)"
              bad=1
            fi
          done
          exit $bad
