name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0   # builds and type-checks the generated React app; runs the TypeScript runtime tests
        with:
          node-version: "22"
      - name: Install test tooling (hash-locked) and the package (no dependencies)
        run: |
          pip install --require-hashes -r ci/requirements-test.txt
          pip install --no-deps -e .
      - run: ruff check src tests
      - run: mypy src
      - name: Tests with coverage
        run: |
          python -m coverage run -m pytest tests/ -q --tb=short
          python -m coverage report
          python -m coverage json -o coverage.json -q
          python ci/check_coverage.py coverage.json 80

  reproducible-build:
    # The same commit must build to the same bytes (wheel and sdist), so anyone can check a release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build twice and compare
        run: |
          pip install --require-hashes -r ci/requirements-build.txt
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for i in 1 2; do
            python -m build -o "out$i" .
            python ci/reproducible_sdist.py out$i/*.tar.gz
            rm -rf build src/*.egg-info
            sleep 2
          done
          (cd out1 && sha256sum *) > one.txt
          (cd out2 && sha256sum *) > two.txt
          cat one.txt
          diff one.txt two.txt

  zero-deps:
    # sp2react must import and run with nothing but the standard library installed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --no-deps .
          test "$(/tmp/bare/bin/pip list --format=freeze | grep -v -E '^(pip|setuptools|sp2react)==' | wc -l)" = 0
          cd /tmp && /tmp/bare/bin/sp2react -c /tmp/sp2react.yaml init && /tmp/bare/bin/python -c "
          import sp2react.pipeline, sp2react.transport, sp2react.ntlm
          from sp2react.config import load_config
          print(load_config('/tmp/sp2react.yaml').sharepoint.site_url)"

  sandbox-container:
    # pipeline.sandbox: container: generated back-end tests in a Docker container (no network, read-only, no secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test tooling (hash-locked) and the package (no dependencies)
        run: |
          pip install --require-hashes -r ci/requirements-test.txt
          pip install --no-deps -e .
      - name: Container sandbox tests
        env:
          SP2REACT_TEST_CONTAINER: "1"
        run: python -m pytest tests/test_sandbox.py -q --tb=short -k container
      - name: Check image base is pinned by digest
        run: grep -E '^FROM [^ ]+@sha256:[0-9a-f]{64}' src/sp2react/container/Dockerfile || { docker pull -q python:3.12-slim && docker inspect --format '{{index .RepoDigests 0}}' python:3.12-slim; exit 1; }

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes -r ci/requirements-docs.txt
          pip install --no-deps -e .
      - run: python -m sphinx -W -b html docs docs/_build/html
