name: Publish sp2react to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

# Minimal default — jobs opt in to only what they need.
permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0        # builds the generated React app inside the tests
        with:
          node-version: "22"
      - name: Install package with test extras
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          pip install --upgrade build
          python -m build
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # No PYPI_API_TOKEN needed — uses OIDC Trusted Publishing.
        # Configure at: https://pypi.org/manage/account/publishing/ (pending publisher: sp2react / karthikbd / sp2react / python-publish.yml / release)
