name: Publish sp2react to PyPI

# Publish by creating a GitHub release (vX.Y.Z). One trigger only, so a release never uploads twice.
on:
  release:
    types: [published]
  workflow_dispatch:

# Minimal default - jobs opt in to only what they need.
permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0   # builds the generated React app inside the tests
        with:
          node-version: "22"
      - name: Install test tooling (hash-locked) and the package (no dependencies)
        run: |
          pip install --require-hashes -r ci/requirements-test.txt
          pip install --no-deps -e .
      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          pip install --require-hashes -r ci/requirements-build.txt
          python -m build
          twine check dist/*
      - name: Check the wheel declares no runtime dependencies
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = next(n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA"))
          reqs = [l for l in zipfile.ZipFile(whl).read(meta).decode().splitlines()
                  if l.startswith("Requires-Dist") and "extra ==" not in l]
          assert not reqs, reqs
          print("no runtime dependencies:", whl)
          PY
      - name: Software bill of materials (CycloneDX)
        run: python ci/make_sbom.py sbom/sp2react.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC); also creates PyPI attestations
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # No PYPI_API_TOKEN needed - uses OIDC Trusted Publishing.
        # (publisher: sp2react / karthikbd / sp2react / python-publish.yml / release)

  sign-release-assets:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Sigstore keyless signing
      contents: write   # attach signed files to the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist/
      - name: Sign with Sigstore and attach wheel, sdist, SBOM and signatures to the release
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/*.cdx.json
          release-signing-artifacts: true
