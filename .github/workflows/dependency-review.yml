name: Dependency review

# Software composition analysis on every pull request: blocks a change that adds or upgrades to a
# dependency (CI lock files, GitHub Actions) with a known vulnerability of moderate severity or higher.
# See docs/development/dependencies.md. Needs the repository's dependency graph to be on.
on:
  pull_request:

permissions: read-all

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
