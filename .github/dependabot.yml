version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Keep Python dependencies up to date
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Keep the generated app's front-end template free of known vulnerabilities
  - package-ecosystem: "npm"
    directory: "/src/sp2react/scaffold/templates/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # The generated app's back-end template. Its requirements are minimums (>=), so a fresh
  # install already gets the newest release; raise a minimum only when the range allows a
  # version with a known advisory (Dependabot security updates do that) or one that breaks.
  # Raising them for every release would cut off Python versions the app still supports.
  - package-ecosystem: "pip"
    directory: "/src/sp2react/scaffold/templates/backend"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Keep the hash-locked CI tool sets up to date
  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # The fuzzing base image (pinned by digest)
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # The container image the generated app's tests run in (pipeline.sandbox: container).
  # Digest updates (security patches of the same Python) only: its Python version must be
  # one sp2react supports and tests, and new Pythons often lack wheels the app needs.
  - package-ecosystem: "docker"
    directory: "/src/sp2react/container"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
